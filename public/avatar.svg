<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="안연수 일러스트 아바타">
  <rect width="220" height="220" fill="#e8eeff"/>
  <!-- shoulders / white tee -->
  <path d="M30 220 C36 166 72 148 110 148 C148 148 184 166 190 220 Z" fill="#ffffff"/>
  <path d="M30 220 C36 166 72 148 110 148 C148 148 184 166 190 220" fill="none" stroke="#dbe3f4" stroke-width="2"/>
  <!-- neck -->
  <path d="M96 128 h28 v18 q-14 12 -28 0 Z" fill="#eebd95"/>
  <!-- ears -->
  <circle cx="66" cy="104" r="9" fill="#f6cda3"/>
  <circle cx="154" cy="104" r="9" fill="#f6cda3"/>
  <!-- head -->
  <ellipse cx="110" cy="98" rx="46" ry="50" fill="#f9d2aa"/>
  <!-- hair -->
  <path d="M62 104 C57 54 85 34 110 34 C135 34 163 54 158 104 C156 92 150 84 148 82 C141 90 135 80 133 78 C123 85 97 85 87 78 C85 80 79 90 72 82 C70 84 64 92 62 104 Z" fill="#20262f"/>
  <!-- eyebrows -->
  <path d="M80 83 q9 -4 18 -1" stroke="#262b33" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M122 82 q9 -3 18 1" stroke="#262b33" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- glasses -->
  <g stroke="#3a4150" stroke-width="3">
    <circle cx="90" cy="99" r="15" fill="#ffffff" fill-opacity="0.22"/>
    <circle cx="130" cy="99" r="15" fill="#ffffff" fill-opacity="0.22"/>
    <path d="M105 99 q5 -4 10 0" fill="none"/>
    <path d="M75 97 l-9 -3" fill="none" stroke-linecap="round"/>
    <path d="M145 97 l9 -3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- eyes -->
  <circle cx="90" cy="100" r="3" fill="#222c38"/>
  <circle cx="130" cy="100" r="3" fill="#222c38"/>
  <!-- nose -->
  <path d="M110 105 l-3 10 q3 3 6 0" stroke="#e6b184" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M99 125 q11 8 22 0" stroke="#cd8160" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
